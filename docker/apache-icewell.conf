# ICEWELL — vhost del contenedor. Las reglas de seguridad viven en los .htaccess
# (web/.htaccess, web/admin/.htaccess, web/assets/obras/.htaccess), igual que en el hosting.
<VirtualHost *:80>
    DocumentRoot /var/www/icewell/web
    <Directory /var/www/icewell/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # servidor/ y herramientas/ quedan fuera del DocumentRoot; por si acaso:
    <Directory /var/www/icewell/servidor>
        Require all denied
    </Directory>
    # Desarrollo (ICEWELL_SIN_HTTPS=1): no redirigir a https en http://localhost.
    # SetEnvIf corre antes que mod_rewrite (SetEnv llegaría tarde).
    SetEnvIf Request_URI "^" ICEWELL_SIN_HTTPS=${ICEWELL_SIN_HTTPS}
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
